'use strict';const D=__DATA__;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const byId=Object.fromEntries(D.items.map(i=>[i.id,i]));const cats={play:['游玩','#285b4d','游'],food:['吃饭','#b37436','食'],stay:['住宿','#79638f','宿'],transit:['口岸','#647884','行']};let day=1,tab='plan',selected=null,routeSelected=null,mapId='zhuhai',filters=new Set(Object.keys(cats)),view=[0,0,1024,1024],drag=null;let personal={};try{personal=JSON.parse(localStorage.getItem('coastal-four-days-2026')||'{}')}catch{}const daily=()=>D.days[day-1],mapConf=()=>D.maps.find(m=>m.id===mapId);let toastTimer;

function renderPanel(){const d=daily();let out='';if(tab==='plan'){out=`<div class="day-tip">${esc(d.note)}</div><div class="section-label"><span>建议时段 · 可随现场节奏调整</span><span>${d.steps.length} 个停留</span></div>`;out+=d.steps.map((s,k)=>{let leg='';if(k<d.steps.length-1){const next=d.steps[k+1],r=between(s.item,next.item);if(r)leg=`<button class="leg" data-route="${r.id}">↳ ${routeText(r)}</button>`;else if(s.item==='gongbei'&&next.item==='barrier'||s.item==='barrier'&&next.item==='longzhuda')leg='<div class="leg">↳ 步行过关预留 45–90 分钟 · 另计回住处步行</div>';else if(day>=3)leg='<div class="leg">↳ 园内步行约 5–20 分钟（估算）· 不含排队</div>'}return `<div class="step"><span class="step-dot">${k+1}</span><div class="step-time">${s.time} · ${esc(s.note)}</div>${card(byId[s.item])}${leg}</div>`}).join('');out+=`<div class="stay-strip">☾ ${d.stay}<button class="leg" data-switch="stay">查看住宿位置与备选 →</button></div>`}else if(tab==='food'||tab==='stay'){out=`<div class="day-tip">${tab==='stay'?(day<3?'建议拱北连住 9/12、9/13 两晚。13 日往返澳门，行李留在住处。':'9/14 晚住长隆附近；这里只需选一家。9/15 退房寄存，离园后取行李。'):'主餐选一家，小吃按胃口加。推荐依据为原文实测与顺路程度；没有使用指定日期的实时菜单和价格。'}</div>`;out+=D.items.filter(i=>i.days.includes(day)&&i.cat===tab).sort((a,b)=>a.priority-b.priority).map(i=>`<div class="option"><div class="rank">${i.priority===1?'01 / 优先比较':i.priority===2?'备选 / 按预算与偏好':'备选 / 接受取舍再选'}</div>${card(i)}</div>`).join('');if(tab==='stay')out+='<div class="notice">酒店尚未预订，未查询指定日期房价和空房。路线默认龙珠达 + 企鹅酒店，换酒店后首末段需重查。提前入园与多次出入按所购套票条款确认。</div>'}else{out='<div class="day-tip">显示 9/06 高德查询的基础时间，打车采用驾车路线参考。建议预留含一般候车或步行绕行余量；不含过关、游玩和排队。</div>';if(day===2)out+='<div class="crossing">拱北 ⇄ 关闸：步行过关。每次预留 45–90 分钟（规划估算）。澳门出租车只计算澳门境内路段。</div>';out+=D.routes.filter(r=>r.day===day).map(r=>`<button class="route-card ${routeSelected===r.id?'selected':''}" data-route="${r.id}"><b>${esc(pointName(r.from))} → ${esc(pointName(r.to))}</b><p>${routeText(r)}</p><small>${(r.distance/1000).toFixed(1)} km · ${r.status==='amap'?'高德已查询':'未核实'}${day===4&&r.to==='zhuhai_station'?' · 珠海站为可选返程 function fitMap(){const rect=$('#map').getBoundingClientRect();if(!rect.width||!rect.height)return;let pts=visible().map(i=>project(i.location)).filter(p=>p.every(v=>v>=0&&v<=1024));if(routeSelected){const r=D.routes.find(r=>r.id===routeSelected);if(r?.polyline?.length)pts=r.polyline.map(project).filter(p=>p.every(v=>v>=0&&v<=1024))}if(!pts.length)pts=[[250,250],[774,774]];const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);let w=Math.max(320,Math.max(...xs)-Math.min(...xs)+200),h=Math.max(320,Math.max(...ys)-Math.min(...ys)+250);const ratio=rect.width/rect.height;if(w/h>ratio)h=w/ratio;else w=h*ratio;if(w>1024||h>1024){const f=Math.max(w/1024,h/1024);w/=f;h/=f}const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;view=[Math.max(0,Math.min(1024-w,cx-w/2)),Math.max(0,Math.min(1024-h,cy-h/2)),w,h];setView();if(isSmall()&&selected&&!$('#popup').classList.contains('hidden'))focusSelected()}

function showPlace(id,move=true){selected=id;routeSelected=null;const i=byId[id];if(!i.days.includes(day)){setDay(i.days[0]);selected=id}filters.add(i.cat);if((tab==='stay'||tab==='food')&&tab!==i.cat)tab='plan';if(day>=3&&i.cat==='stay'&&i.id!=='penguinhotel')changeMap('resort');renderNav();renderPanel();renderRoutes();renderMarks();if(isSmall()){document.body.classList.add('map-mode');$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='map'));requestAnimationFrame(()=>{fitMap();focusSelected()})}if(move){const pos=project(i.location);if(pos[0]<view[0]+40||pos[0]>view[0]+view[2]-50||pos[1]<view[1]+90||pos[1]>view[1]+view[3]-80){view[0]=Math.max(0,Math.min(1024-view[2],pos[0]-view[2]/2));view[1]=Math.max(0,Math.min(1024-view[3],pos[1]-view[3]/2));setView()}}const nav=`https://uri.amap.com/marker?position=${i.location.join(',')}&name=${encodeURIComponent(i.name)}&coordinate=gaode&callnative=0`;$('#popup').innerHTML=`<button class="close" data-close-popup aria-label="关闭详情">×</button><div class="eyebrow">${cats[i.cat][0]} · ${i.priority===1?'优先推荐':'备选'}</div><h3>${esc(i.name)}</h3><p>${esc(i.detail)}</p><div class="small">⌖ ${esc(i.address)}</div>${i.location_note.startsWith('高德')?'':`<div class="map-accuracy">${esc(i.location_note)}</div>`}<div class="buttons"><button class="quiet" data-star="${id}">${personal[id]?.star?'★ 已收藏':'☆ 收藏'}</button><a class="quiet" target="_blank" rel="noopener" href="${nav}">高德查看地点 ↗</a></div><textarea data-note="${id}" aria-label="${esc(i.name)}的个人备注" placeholder="写下自己的备注，自动保存在此浏览器…">${esc(personal[id]?.note||'')}</textarea><p class="small">推荐依据 · 已读取原文</p>${i.sources.map(k=>{const s=D.sources[k];return `<a class="source-link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)} ↗<small>${esc(s.author)} · ${esc(s.date)}</small></a>`}).join('')}`;$('#popup').classList.remove('hidden')}
function focusSelected(){if(!isSmall()||!selected)return;const r=$('#map').getBoundingClientRect(),p=project(byId[selected].location);let w=Math.min(view[2],300),h=w*r.height/r.width;if(h>800){h=800;w=h*r.width/r.height}view=[Math.max(0,Math.min(1024-w,p[0]-w*.4)),Math.max(0,Math.min(1024-h,p[1]-h*.25)),w,h];setView()}
function showRoute(id){const r=D.routes.find(r=>r.id===id);if(!r)return;if(r.day!==day)setDay(r.day);tab='transport';routeSelected=id;selected=null;if(day>=3&&(r.from==='longzhuda'||r.to==='zhuhai_station')&&D.maps.some(m=>m.id==='transfer'))mapId='transfer';renderNav();renderPanel();changeMap(mapId);const a=byId[r.from],b=byId[r.to],nav=`https://uri.amap.com/navigation?from=${r.params.origin},${encodeURIComponent(pointName(r.from))}&to=${r.params.destination},${encodeURIComponent(pointName(r.to))}&mode=${r.mode==='walk'?'walk':'car'}&coordinate=gaode&callnative=0`;$('#popup').innerHTML=`<button class="close" data-close-popup aria-label="关闭详情">×</button><div class="eyebrow">交通 · 高德已查询</div><h3>${esc(pointName(r.from))} → ${esc(pointName(r.to))}</h3><p>${routeText(r)}</p><div class="small">${(r.distance/1000).toFixed(2)} 公里 · 查询 ${D.checked}</div><p>基础时间不含等车、过关和游玩。打车采用驾车路线参考；园区与酒店出入口、室内绕行还需额外留时。</p><a class="quiet" href="${nav}" target="_blank" rel="noopener">重新打开高德导航 ↗</a>`;$('#popup').classList.remove('hidden');if(isSmall())mobile('map')}
function zoom(f,cx,cy){const rect=$('#map').getBoundingClientRect(),px=cx===undefined?.5:cx/rect.width,py=cy===undefined?.5:cy/rect.height;let w=Math.min(1024,Math.max(180,view[2]*f)),h=w*rect.height/rect.width;if(h>1024){h=1024;w=h*rect.width/rect.height}view=[Math.max(0,Math.min(1024-w,view[0]+view[2]*px-w*px)),Math.max(0,Math.min(1024-h,view[1]+view[3]*py-h*py)),w,h];setView()}
$('#map').addEventListener('wheel',e=>{e.preventDefault();const r=$('#map').getBoundingClientRect();zoom(e.deltaY>0?1.15:.87,e.clientX-r.x,e.clientY-r.y)},{passive:false});$('#map').addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,v:[...view],moved:false};$('#map').setPointerCapture(e.pointerId)});$('#map').addEventListener('pointermove',e=>{if(!drag)return;const rect=$('#map').getBoundingClientRect(),dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5){drag.moved=true;$('#map').classList.add('dragging')}if(drag.moved){view[0]=Math.max(0,Math.min(1024-view[2],drag.v[0]-dx*view[2]/rect.width));view[1]=Math.max(0,Math.min(1024-view[3],drag.v[1]-dy*view[3]/rect.height));setView()}});$('#map').addEventListener('pointerup',e=>{const moved=drag?.moved;drag=null;$('#map').classList.remove('dragging');if(moved){e.preventDefault();return}const target=document.elementFromPoint(e.clientX,e.clientY),g=target?.closest('[data-group]'),r=target?.closest('[data-route]');if(g){const group=groups[+g.dataset.group];if(group.items.length===1)showPlace(group.items[0].id,false);else{$('#popup').innerHTML='<button class="close" data-close-popup aria-label="关闭">×</button><h3>附近的 '+group.items.length+' 个地点</h3><p>同一区域或室内项目，可逐个查看。</p>'+group.items.map(i=>`<div class="option">${card(i)}</div>`).join('');$('#popup').classList.remove('hidden')}}else if(r)showRoute(r.dataset.route)});$('#map').addEventListener('pointercancel',()=>{drag=null;$('#map').classList.remove('dragging')});

$('#sourcesBtn').onclick=sourcesDialog;$('#planBtn').onclick=()=>{$('#planBody').innerHTML=`<p>珠海看海、澳门逛吃，再把两整天留给长隆。前两晚住拱北，第三晚换到长隆附近，减少带行李过关。</p><table><thead><tr><th>日期</th><th>游玩重点</th><th>晚上</th></tr></thead><tbody>${D.days.map(d=>`<tr><td>${d.date}<br>${d.week}</td><td>${d.sub}</td><td>${d.stay}</td></tr>`).join('')}</tbody></table><div class="notice">${D.assumptions}</div><p>9/14 海洋王国、9/15 飞船乐园各一天。演出场次与开放项目以当天官方公告为准；遇天气或班次约束，需要再调整。</p><p>地图使用高德底图快照，可离线拖动、缩放；放大不会加载新街道细节。绿色虚线为步行，蓝线为驾车参考，园内点状虚线仅代表游玩顺序。</p><p>已查询 22 段交通。过关单程预留 45–90 分钟为规划估算。高德车程不是出行日预测，所有酒店与餐厅价格、库存和订位尚未核实。</p><div class="buttons"><button class="quiet" id="openSources">查看 ${Object.keys(D.sources).length} 篇小红书原文</button> <a class="quiet" href="交通时间.csv" download>交通表 CSV</a> <a class="quiet" href="行程与来源.md" download>完整行程与来源</a></div>`;$('#planDialog').showModal();$('#openSources').onclick=()=>{$('#planDialog').close();sourcesDialog()}};
